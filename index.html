<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中物理教案庫</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
<style>
  :root{
    --bg:#f5f6f9; --card:#fff; --text:#12161c; --muted:#6b7480; --faint:#98a1ad;
    --line:#e4e7ec; --line2:#eef0f4;
    --brand:#4f46e5; --brand-2:#6366f1; --brand-soft:#eef0fe;
    --ok:#0d9488; --warn:#d97706;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.05);
    --r:14px;
  }
  html[data-theme="dark"]{
    --bg:#0d1017; --card:#161b23; --text:#e8ebf0; --muted:#98a2b3; --faint:#6b7480;
    --line:#242b35; --line2:#1d232c;
    --brand:#818cf8; --brand-2:#a5b4fc; --brand-soft:#1e2438;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}

  header.top{background:linear-gradient(180deg,var(--brand-soft),transparent);border-bottom:1px solid var(--line)}
  .top-in{max-width:1080px;margin:0 auto;padding:30px 20px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .top-in h1{margin:0;font-size:1.55rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .top-in .sub{margin:4px 0 0;color:var(--muted);font-size:.88rem}
  .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;
    padding:10px 16px;border-radius:10px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;
    text-decoration:none;transition:.15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--text)}
  .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;
    width:38px;height:38px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
  .iconbtn:hover{color:var(--text)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:26px 0 34px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .n{font-size:1.85rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .kpi .n small{font-size:.9rem;font-weight:500;color:var(--faint)}
  .kpi .l{color:var(--muted);font-size:.8rem;margin-top:2px}
  .bar{height:5px;background:var(--line2);border-radius:99px;margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}

  section{margin-bottom:38px}
  .h2{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
  .h2 h2{font-size:1.02rem;margin:0;letter-spacing:-.01em}
  .h2 .hint{color:var(--faint);font-size:.78rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-top:12px}

  /* 課綱覆蓋地圖 */
  .crow{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line2)}
  .crow:last-child{border-bottom:none}
  .cname{font-size:.84rem;font-weight:650;padding-top:5px}
  .cname .exam{display:block;font-weight:400;font-size:.7rem;color:var(--faint);margin-top:1px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;
    padding:5px 10px;font-size:.78rem;cursor:pointer;transition:.13s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .chip:hover{border-color:var(--brand);color:var(--text)}
  .chip[data-n="0"]{border-style:dashed;color:var(--faint);opacity:.75}
  .chip .b{background:rgba(255,255,255,.28);border-radius:20px;padding:0 6px;font-size:.7rem;font-weight:700}
  .chip.on{outline:2px solid var(--brand);outline-offset:1px}
  .legend{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:.74rem;margin-top:12px}
  .legend i{width:22px;height:11px;border-radius:3px;display:inline-block}

  /* 議題 bars */
  .ibar{display:grid;grid-template-columns:88px 1fr 34px;gap:11px;align-items:center;padding:4px 0;cursor:pointer}
  .ibar:hover .ilabel{color:var(--text)}
  .ilabel{font-size:.82rem;color:var(--muted);text-align:right;white-space:nowrap}
  .itrack{background:var(--line2);border-radius:99px;height:14px;overflow:hidden}
  .itrack>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .ival{font-size:.8rem;color:var(--muted);font-weight:600}
  .unused{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--faint);font-size:.78rem;line-height:1.9}
  .unused b{color:var(--muted);font-weight:600}

  /* 資源庫存 */
  .stocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
  .stock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.13s;text-align:left;font-family:inherit;color:inherit}
  .stock:hover{border-color:var(--brand)}
  .stock.on{outline:2px solid var(--brand);outline-offset:1px}
  .stock .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:.95rem;margin-bottom:8px}
  .stock .n{font-size:1.35rem;font-weight:700;line-height:1.1}
  .stock .l{font-size:.76rem;color:var(--muted)}

  /* 篩選列 + 卡片 */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{position:relative;flex:1;min-width:200px}
  .search input{width:100%;padding:11px 14px 11px 38px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font:inherit;font-size:.9rem;outline:none}
  .search input:focus{border-color:var(--brand)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4}
  .active-filters{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{background:var(--brand-soft);color:var(--brand);border:1px solid transparent;border-radius:8px;
    padding:5px 9px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit}
  .fchip:hover{text-decoration:line-through}

  .lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;
    box-shadow:var(--shadow);margin-bottom:12px}
  .lhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .ltitle{font-size:1.04rem;font-weight:650;margin:0;letter-spacing:-.01em;flex:1;min-width:180px}
  .ldate{color:var(--faint);font-size:.78rem;white-space:nowrap;padding-top:3px}
  .lmeta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 0}
  .tag{font-size:.74rem;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
  .tag.ch{border-color:transparent;background:var(--brand-soft);color:var(--brand);font-weight:600}
  .tag.iss{border-color:transparent;background:rgba(13,148,136,.11);color:var(--ok);font-weight:600}
  .ltopic{color:var(--muted);font-size:.87rem;margin:9px 0 0}
  .assets{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;padding-top:13px;border-top:1px solid var(--line2)}
  .abtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;
    padding:6px 11px;font-size:.79rem;text-decoration:none;color:var(--muted);transition:.13s;background:var(--card)}
  .abtn:hover{border-color:currentColor}
  .abtn .dot{width:7px;height:7px;border-radius:50%}

  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:40px 24px;
    text-align:center;color:var(--muted);font-size:.92rem}
  .empty h3{color:var(--text);margin:0 0 8px;font-size:1.05rem}
  .empty code{background:var(--brand-soft);color:var(--brand);padding:2px 7px;border-radius:6px}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:.78rem;
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  footer a{color:var(--brand);text-decoration:none}
  .hide{display:none !important}
  @media(max-width:640px){
    .crow{grid-template-columns:1fr;gap:6px}
    .cname{padding-top:0}
    .ibar{grid-template-columns:76px 1fr 30px}
    .top-in h1{font-size:1.3rem}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div>
      <h1>⚛️ <span id="siteTitle">高中物理教案庫</span></h1>
      <p class="sub" id="siteSub">108課綱 · PBL議題融入 · 素養導向題組</p>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="upload.html">＋ 新增教案</a>
    <button class="iconbtn" id="themeBtn" aria-label="切換深色或淺色模式">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div id="app"></div>

  <div class="kpis" id="kpis"></div>

  <section id="secMap">
    <div class="h2"><h2>課綱覆蓋地圖</h2><span class="hint">點章節可篩選下方教案</span></div>
    <div class="panel" id="mapBox"></div>
  </section>

  <section id="secIssue">
    <div class="h2"><h2>議題融入統計</h2><span class="hint">點議題可篩選</span></div>
    <div class="panel" id="issueBox"></div>
  </section>

  <section id="secStock">
    <div class="h2"><h2>題組與學習單庫存</h2><span class="hint">點卡片可篩選</span></div>
    <div class="stocks" id="stockBox" style="margin-top:12px"></div>
  </section>

  <section id="secList">
    <div class="h2"><h2>教案清單</h2><span class="hint" id="listCount"></span></div>
    <div class="toolbar" style="margin-top:12px">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋標題、主題、章節、議題…" autocomplete="off">
      </div>
      <div class="active-filters" id="afBox"></div>
    </div>
    <div id="listBox"></div>
  </section>

  <footer>
    <span id="footL"></span>
    <span id="footR"></span>
  </footer>
</div>

<script src="assets/curriculum.js"></script>
<script>
/* ---------- 主題 ---------- */
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
                set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
document.documentElement.dataset.theme = store.get("theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
themeBtn.onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; store.set("theme", t);
};

/* ---------- 工具 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlPath = p => String(p).split("/").map(encodeURIComponent).join("/");
const chapKey = l => `${l.course}｜${l.chapter}`;

let LESSONS = [];
const FILTER = { chapter:null, issue:null, asset:null, q:"" };

/* ---------- 載入 ---------- */
(async function(){
  let data = null;
  try{
    const r = await fetch("lessons.json?v=" + Date.now(), {cache:"no-store"});
    if(r.ok) data = await r.json();
  }catch(e){}

  LESSONS = (data && Array.isArray(data.lessons) ? data.lessons : []).slice()
            .sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));

  if(data && data.title){ siteTitle.textContent = data.title; document.title = data.title }
  if(data && data.subtitle) siteSub.textContent = data.subtitle;

  if(!LESSONS.length){
    document.getElementById("app").innerHTML = `
      <div class="empty" style="margin-top:26px">
        <h3>還沒有任何教案</h3>
        用 Claude 的「物理教案產生器」跑出一份教案後，把產出的檔案
        （儀表板 HTML、教案 Word、學習單、三個題組）一起丟到
        <a href="upload.html">新增教案</a> 頁面，這裡就會自動長出來。
      </div>`;
    ["secMap","secIssue","secStock","secList"].forEach(i=>document.getElementById(i).classList.add("hide"));
    document.getElementById("kpis").classList.add("hide");
    footL.innerHTML = `<a href="upload.html">＋ 新增第一份教案</a>`;
    return;
  }

  renderKpis(); renderMap(); renderIssues(); renderStock(); renderList();

  const last = LESSONS.map(l=>l.date).filter(Boolean).sort().pop();
  footL.textContent = last ? `最後新增：${last}` : "";
  footR.innerHTML = `<a href="upload.html">＋ 新增教案</a>`;
})();

/* ---------- KPI ---------- */
function renderKpis(){
  const covered = new Set(LESSONS.map(chapKey));
  const total = ALL_CHAPTERS.length;
  const nSet = LESSONS.reduce((s,l)=>s + (l.assets||[]).filter(a=>["reading","cross","inquiry"].includes(a.type)).length, 0);
  const nWs  = LESSONS.reduce((s,l)=>s + (l.assets||[]).filter(a=>a.type==="worksheet").length, 0);
  const pct  = Math.round(covered.size/total*100);
  kpis.innerHTML = `
    <div class="kpi"><div class="n">${LESSONS.length}</div><div class="l">份教案</div></div>
    <div class="kpi"><div class="n">${covered.size}<small> / ${total}</small></div><div class="l">章節已覆蓋（${pct}%）</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="kpi"><div class="n">${nSet}</div><div class="l">份素養題組</div></div>
    <div class="kpi"><div class="n">${nWs}</div><div class="l">份學習單</div></div>`;
}

/* ---------- 課綱覆蓋地圖 ---------- */
function renderMap(){
  const count = {};
  LESSONS.forEach(l => count[chapKey(l)] = (count[chapKey(l)]||0) + 1);
  const max = Math.max(1, ...Object.values(count));
  const shade = n => n===0 ? "" :
    `background:color-mix(in srgb, var(--brand) ${Math.round(24 + 62*(n/max))}%, transparent);color:#fff;border-color:transparent;`;

  mapBox.innerHTML = CURRICULUM.map(c => `
    <div class="crow">
      <div class="cname">${esc(c.course)}<span class="exam">${esc(c.exam)}範圍</span></div>
      <div class="chips">${c.chapters.map(ch => {
        const key = `${c.short}｜${ch}`, n = count[key]||0;
        return `<button class="chip${FILTER.chapter===key?" on":""}" data-n="${n}" data-chapter="${esc(key)}"
                  style="${shade(n)}" title="${esc(key)}：${n} 份教案">
                  ${esc(ch)}${n?`<span class="b">${n}</span>`:""}</button>`;
      }).join("")}</div>
    </div>`).join("") + `
    <div class="legend">教案密度
      <i style="background:var(--line2)"></i>0
      <i style="background:color-mix(in srgb,var(--brand) 35%,transparent)"></i>少
      <i style="background:color-mix(in srgb,var(--brand) 86%,transparent)"></i>多
    </div>`;

  mapBox.querySelectorAll("[data-chapter]").forEach(b => b.onclick = () => {
    FILTER.chapter = FILTER.chapter === b.dataset.chapter ? null : b.dataset.chapter;
    renderMap(); renderList();
  });
}

/* ---------- 議題融入統計 ---------- */
function renderIssues(){
  const count = {};
  LESSONS.forEach(l => (l.issues||[]).forEach(i => count[i] = (count[i]||0)+1));
  const used = ISSUES.filter(i => count[i]).sort((a,b)=>count[b]-count[a]);
  const unused = ISSUES.filter(i => !count[i]);
  const max = Math.max(1, ...used.map(i=>count[i]));

  issueBox.innerHTML = (used.length ? used.map(i => `
      <div class="ibar" data-issue="${esc(i)}" title="點擊篩選">
        <div class="ilabel" style="${FILTER.issue===i?"color:var(--brand);font-weight:700":""}">${esc(i)}</div>
        <div class="itrack"><i style="width:${Math.max(6, count[i]/max*100)}%"></i></div>
        <div class="ival">${count[i]}</div>
      </div>`).join("")
    : `<div style="color:var(--muted);font-size:.88rem">目前的教案還沒有標記議題。</div>`)
    + (unused.length ? `<div class="unused"><b>尚未融入的議題（${unused.length}）：</b>${unused.map(esc).join("、")}</div>` : "");

  issueBox.querySelectorAll("[data-issue]").forEach(b => b.onclick = () => {
    FILTER.issue = FILTER.issue === b.dataset.issue ? null : b.dataset.issue;
    renderIssues(); renderList();
  });
}

/* ---------- 資源庫存 ---------- */
function renderStock(){
  const count = {};
  LESSONS.forEach(l => (l.assets||[]).forEach(a => count[a.type] = (count[a.type]||0)+1));
  stockBox.innerHTML = ASSET_TYPES.filter(t=>t.key!=="other" || count.other).map(t => `
    <button class="stock${FILTER.asset===t.key?" on":""}" data-asset="${t.key}">
      <div class="ic" style="background:${t.color}">${t.icon}</div>
      <div class="n">${count[t.key]||0}</div>
      <div class="l">${esc(t.label)}</div>
    </button>`).join("");
  stockBox.querySelectorAll("[data-asset]").forEach(b => b.onclick = () => {
    FILTER.asset = FILTER.asset === b.dataset.asset ? null : b.dataset.asset;
    renderStock(); renderList();
  });
}

/* ---------- 教案清單 ---------- */
function renderList(){
  const term = FILTER.q.trim().toLowerCase();
  const hit = LESSONS.filter(l => {
    if(FILTER.chapter && chapKey(l) !== FILTER.chapter) return false;
    if(FILTER.issue && !(l.issues||[]).includes(FILTER.issue)) return false;
    if(FILTER.asset && !(l.assets||[]).some(a=>a.type===FILTER.asset)) return false;
    if(term){
      const hay = [l.title,l.topic,l.course,l.chapter,l.note,(l.issues||[]).join(" "),
                   (l.assets||[]).map(a=>a.name).join(" ")].join(" ").toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });

  /* 篩選標籤 */
  const chips = [];
  if(FILTER.chapter) chips.push(["chapter", FILTER.chapter]);
  if(FILTER.issue)   chips.push(["issue", "議題：" + FILTER.issue]);
  if(FILTER.asset)   chips.push(["asset", ASSET_MAP[FILTER.asset].label]);
  afBox.innerHTML = chips.map(([k,v]) => `<button class="fchip" data-clear="${k}">${esc(v)} ✕</button>`).join("");
  afBox.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => {
    FILTER[b.dataset.clear] = null; renderMap(); renderIssues(); renderStock(); renderList();
  });

  listCount.textContent = `共 ${hit.length} 份` + (hit.length !== LESSONS.length ? `（全部 ${LESSONS.length} 份）` : "");

  if(!hit.length){
    listBox.innerHTML = `<div class="empty">沒有符合條件的教案。</div>`;
    return;
  }

  listBox.innerHTML = hit.map(l => {
    const assets = (l.assets||[]).map(a => {
      const t = ASSET_MAP[a.type] || ASSET_MAP.other;
      const open = a.type === "dashboard";
      return `<a class="abtn" href="${urlPath(a.path)}" ${open?'target="_blank" rel="noopener"':'download'}
                style="color:${t.color}" title="${esc(a.name)}">
                <span class="dot" style="background:${t.color}"></span>${esc(t.label)}${open?" ↗":" ↓"}</a>`;
    }).join("");
    return `<article class="lcard">
      <div class="lhead">
        <h3 class="ltitle">${esc(l.title)}</h3>
        <span class="ldate">${esc(l.date||"")}</span>
      </div>
      <div class="lmeta">
        <span class="tag ch">${esc(l.course)} ${esc(l.chapter)}</span>
        ${(l.issues||[]).map(i=>`<span class="tag iss">${esc(i)}</span>`).join("")}
      </div>
      ${l.topic ? `<p class="ltopic">${esc(l.topic)}</p>` : ""}
      ${l.note ? `<p class="ltopic" style="color:var(--faint)">${esc(l.note)}</p>` : ""}
      ${assets ? `<div class="assets">${assets}</div>` : ""}
    </article>`;
  }).join("");
}

q.addEventListener("input", () => { FILTER.q = q.value; renderList() });
</script>
</body>
</html>
